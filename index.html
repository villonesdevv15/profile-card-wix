<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOME | ProfileCard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&family=Montserrat:wght@800&family=Patrick+Hand&family=Caudex&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <p class="site-header__title">ABOUT ME</p>
  </header>

  <main class="card">
    <section class="card__photo" aria-label="Photo">
      <img class="card__portrait"
           src="https://static.wixstatic.com/media/9a1502_164e7db5bd974a489fb1487c82ed7366~mv2.jpg/v1/crop/x_0,y_192,w_1536,h_1664/fill/w_862,h_934,al_c,q_85/portrait.jpg"
           alt="Portrait of Lorenz Villones" width="431" height="467">
    </section>

    <section class="card__content">
      <h1 class="card__title">About me</h1>
      <p class="card__bio">Hi I'm Lorenz Villones, 17 years old, from Imus Cavite. I'm a bit shy when it comes to web development. I'll try to do what I can do best. :D</p>

      <a class="btn" href="my-hobbies.html">MY HOBBIES</a>

      <img class="card__mascot"
           src="https://static.wixstatic.com/media/9a1502_e893c40b6eb34bdb9e51b7141a35f630~mv2.jpg/v1/fill/w_674,h_672,al_c,q_85/mascot.jpg"
           alt="" width="337" height="336">

      <div class="player" id="player">
        <!-- Add your audio file path below; the original Wix export did not include the source URL -->
        <audio id="audio" src="" preload="none"></audio>
        <button class="player__btn" id="playBtn" type="button" aria-label="Play" aria-pressed="false">
          <svg viewBox="0 0 18 20" width="18" height="20" aria-hidden="true"><path id="playIcon" d="M17.29 9.02c.96.54.96 1.42 0 1.96L1.74 19.78C.78 20.33 0 19.87 0 18.76V1.24C0 .13.78-.32 1.74.22l15.55 8.8z" fill="currentColor"/></svg>
        </button>
        <input class="player__range" id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Seek">
      </div>

      <ul class="social" aria-label="Social links">
        <li><a href="https://www.facebook.com/lorenz.villones" target="_blank" rel="noreferrer noopener" aria-label="Facebook">
          <img src="https://static.wixstatic.com/media/e316f544f9094143b9eac01f1f19e697.png/v1/fill/w_78,h_78/facebook.png" alt="" width="39" height="39"></a></li>
        <li><a href="https://www.twitter.com/ValestraXD" target="_blank" rel="noreferrer noopener" aria-label="Twitter">
          <img src="https://static.wixstatic.com/media/9c4b521dd2404cd5a05ed6115f3a0dc8.png/v1/fill/w_78,h_78/twitter.png" alt="" width="39" height="39"></a></li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
